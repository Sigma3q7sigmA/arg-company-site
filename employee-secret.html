<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>社内お知らせ | 灯希エネルギー株式会社</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                "Yu Gothic",
                YuGothic,
                sans-serif;

            color: #111;
            background: #fff;
        }

        header {
            border-bottom: 1px solid #ddd;
            padding: 20px 40px;
        }

        header a {
            text-decoration: none;
            color: #111;
        }

        .company-name {
            font-size: 20px;
            font-weight: bold;
        }

        .company-name span {
            display: block;

            font-size: 11px;
            letter-spacing: 0.15em;

            font-weight: normal;

            margin-top: 4px;
        }

        main {
            max-width: 900px;

            margin: 80px auto;

            padding: 0 30px;
        }

        .page-title {
            margin-bottom: 50px;
        }

        .page-title h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .page-title p {
            margin: 0;
            color: #777;
        }

        .notice-area {

            border-top: 2px solid #111;

        }

        .notice {

            padding: 35px 0;

            border-bottom: 1px solid #ddd;

        }

        .notice-date {

            font-size: 14px;

            color: #777;

            margin-bottom: 12px;

        }

        .notice-title {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 30px;

        }

        .notice-body {

            font-size: 16px;

            line-height: 2;

        }

        .internal-warning {

            margin-top: 50px;

            padding: 20px;

            border: 1px solid #ddd;

            background: #f7f7f7;

            font-size: 13px;

            line-height: 1.8;

            color: #555;

        }

        .back {

            margin-top: 60px;

        }

        .back a {

            color: #111;

        }

        .back a:hover {

            color: #ff0000;

        }

    </style>

</head>


<body>


<header>

    <a href="index.html">

        <div class="company-name">

            灯希エネルギー株式会社

            <span>
                TOUKI ENERGY CORPORATION
            </span>

        </div>

    </a>

</header>


<main>


    <div class="page-title">

        <h1>社内お知らせ</h1>

        <p>
            INTERNAL INFORMATION
        </p>

    </div>


    <div class="notice-area">


        <article class="notice">

            <div class="notice-date">
                2026.08.16
            </div>


            <div class="notice-title">

                8月16日　エネルギー実験による不具合について

            </div>


            <div class="notice-body">

                <p>
                    8月16日、南埼玉研究生産センターにおいて、
                    次世代エネルギー研究に関連する試験を実施しました。
                </p>

                <p>
                    試験終了後、一部設備において原因不明の異常が確認されています。
                </p>

                <p>
                    現在、詳細な調査を進めています。
                </p>

            </div>

        </article>


    </div>


    <div class="internal-warning">

        本ページは社内関係者向けに公開されています。<br>

        社外への情報共有・転載を一切禁じます。

    </div>


    <div class="back">

        <a href="index.html">
            ← トップページへ戻る
        </a>

    </div>


</main>


</body>

</html>
